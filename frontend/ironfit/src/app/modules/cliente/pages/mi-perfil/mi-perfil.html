<div class="perfil-layout">
    <header class="perfil-header">
        <div class="perfil-header-top">
            <img src="assets/ironfit/IronFit_Horizontal.png" alt="IronFit" class="perfil-logo" />
            <button type="button" class="btn-volver" (click)="volverAlDashboard()">← Volver al panel</button>
        </div>
        <div class="perfil-header-main">
            <span class="perfil-eyebrow">TU ESPACIO PERSONAL</span>
            <h1>Mi perfil</h1>
            <p>Gestiona tus datos personales y la seguridad de tu cuenta.</p>
        </div>
    </header>

    <div *ngIf="mensajeExito" class="mensaje exito" role="status">
        {{ mensajeExito }}
    </div>

    <div *ngIf="mensajeError" class="mensaje error" role="alert">
        {{ mensajeError }}
    </div>

    <div class="perfil-grid">

        <section class="perfil-card">
        <div class="perfil-card-heading"><span class="perfil-card-icon" aria-hidden="true">01</span><div><h2>Datos personales</h2><p>Información de tu cuenta IronFit</p></div></div>

        <div class="form-row">
            <label for="nombres">Nombres</label>
            <input id="nombres" type="text" [(ngModel)]="perfil.nombres" name="nombres">
        </div>

        <div class="form-row">
            <label for="apellidos">Apellidos</label>
            <input id="apellidos" type="text" [(ngModel)]="perfil.apellidos" name="apellidos">
        </div>

        <div class="form-row">
            <label for="correo">Correo</label>
            <input id="correo" type="email" [(ngModel)]="perfil.correo" name="correo">
        </div>

        <div class="form-row">
            <label for="telefono">Teléfono</label>
            <input id="telefono" type="text" [(ngModel)]="perfil.telefono" name="telefono">
        </div>

        <div class="form-row">
            <label>Tipo de documento</label>
            <input type="text" [value]="perfil.tipoDoc || '-'" disabled>
        </div>

        <div class="form-row">
            <label>Número de documento</label>
            <input type="text" [value]="perfil.numDoc || '-'" disabled>
        </div>

        <div class="form-row">
            <label>Rol</label>
            <input type="text" [value]="obtenerRolPrincipal()" disabled>
        </div>

        <div class="form-row">
            <label>Estado</label>
            <input type="text" [value]="perfil.activo ? 'Activo' : 'Inactivo'" disabled>
        </div>

        <div class="acciones">
            <button type="button" class="btn-principal" (click)="guardarPerfil()">
            Guardar cambios
            </button>
        </div>
        </section>

        <section class="perfil-card">
        <div class="perfil-card-heading"><span class="perfil-card-icon" aria-hidden="true">02</span><div><h2>Seguridad</h2><p>Actualiza tu contraseña de acceso</p></div></div>

        <div class="form-row">
            <label for="nuevaPassword">Nueva contraseña</label>
            <input
            id="nuevaPassword"
            type="password"
            autocomplete="new-password"
            [(ngModel)]="password.nueva"
            name="nuevaPassword">
        </div>

        <div class="form-row">
            <label for="confirmarPassword">Confirmar contraseña</label>
            <input
            id="confirmarPassword"
            type="password"
            autocomplete="new-password"
            [(ngModel)]="password.confirmar"
            name="confirmarPassword">
        </div>

        <div class="acciones">
            <button type="button" class="btn-principal" (click)="cambiarPassword()">
            Actualizar contraseña
            </button>
        </div>
        </section>

    </div>
</div>
