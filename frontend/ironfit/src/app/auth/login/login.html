<main class="ironfit-root ironfit-login">
  <section class="auth-layout" aria-label="Inicio de sesión de IronFit">
    <div class="auth-card">
      <aside class="auth-visual" aria-label="Identidad IronFit">
        <div class="auth-visual-content">
          <h2>SUPERA TUS<br><span>LÍMITES.</span></h2>
          <p>Tu mejor versión comienza con cada entrenamiento.</p>
        </div>
        <span class="auth-visual-footer">DISCIPLINA · CONSTANCIA · PROGRESO</span>
      </aside>

      <div class="auth-content">
        <header class="auth-heading">
          <img class="auth-logo auth-logo-mobile" src="assets/ironfit/IronFit_Horizontal.png"
                alt="IronFit — Tu mejor versión" />
          <span class="auth-section-label">BIENVENIDO DE NUEVO</span>
          <h1 class="auth-title">Inicia sesión</h1>
          <p class="auth-subtitle">Ingresa a tu espacio de entrenamiento y seguimiento.</p>
        </header>

        <form class="auth-form" (ngSubmit)="login()">
          <div class="auth-field">
            <label class="auth-label" for="usuario">Correo electrónico</label>
            <input id="usuario" name="usuario" type="email" [(ngModel)]="usuario"
                    class="auth-input" placeholder="tu@correo.com" autocomplete="username" required />
          </div>

          <div class="auth-field">
            <label class="auth-label" for="password">Contraseña</label>
            <div class="password-field">
              <input id="password" name="password" [type]="mostrarPassword ? 'text' : 'password'"
                      [(ngModel)]="clave" class="auth-input" placeholder="Ingresa tu contraseña"
                      autocomplete="current-password" required />
              <button type="button" class="toggle" (click)="togglePassword()"
                      [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                      [attr.aria-pressed]="mostrarPassword">
                {{ mostrarPassword ? 'Ocultar' : 'Mostrar' }}
              </button>
            </div>
          </div>

          <div class="auth-actions">
            <button type="submit" class="auth-button">Iniciar sesión <span aria-hidden="true">→</span></button>
            <div *ngIf="mensajeError" class="auth-error" role="alert">{{ mensajeError }}</div>
          </div>
        </form>

        <footer class="auth-footer">IRONFIT <span aria-hidden="true">•</span> TU MEJOR VERSIÓN</footer>
      </div>
    </div>
  </section>
</main>
