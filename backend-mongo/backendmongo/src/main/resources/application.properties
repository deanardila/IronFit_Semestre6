# Nombre de la aplicación.
sspring.application.name=backendmongo

# Puerto del servidor (8080 por defecto).
server.port=${PORT:8080}

# Conexión a MongoDB.
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# Depuración de seguridad.
logging.level.org.springframework.security=DEBUG
# Depuración de CORS.
logging.level.org.springframework.web.cors=DEBUG

# Clave secreta para JWT.
security.jwt.secret=${JWT_SECRET}
# Duración del JWT en minutos (120 por defecto).
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Modelo para calcular adherencia.
ironfit.modelo.adherencia=classpath:modelos/modelo_adherencia_j48.model
# Modelo para calcular rendimiento.
ironfit.modelo.rendimiento=classpath:modelos/modelo_rendimiento_randomforest.model